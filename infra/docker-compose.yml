name: fleet-twin

services:
  timescaledb:
    image: timescale/timescaledb:2.30.2-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [fleet-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    # Password file is built from .env at start, so no hash lives in git.
    command:
      - sh
      - -c
      - |
        mosquitto_passwd -b -c /mosquitto/passwd "$$MQTT_USERNAME" "$$MQTT_PASSWORD" &&
        chown mosquitto:mosquitto /mosquitto/passwd && chmod 0600 /mosquitto/passwd &&
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    networks: [fleet-net]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -u \"$$MQTT_USERNAME\" -P \"$$MQTT_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # Official minio/minio images are no longer published; Chainguard build pinned by digest
    # (minio RELEASE.2026-09-22T19-25-18Z).
    image: cgr.dev/chainguard/minio@sha256:4cf4831a2bbcf13ddca09c1cbcc9faff716dd3c4247e0babc32864b8ee8e0034
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks: [fleet-net]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r line <&3 && [[ $$line == *200* ]]"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.11-alpine
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks: [fleet-net]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Road distances and times for route optimisation. The first start downloads OSRM_PBF_URL and
  # preprocesses it (several minutes, about 4 GB of memory for the default region); later starts
  # reuse the osrm-data volume. Changing OSRM_PBF_URL makes the next start prepare the new region.
  # Until it is healthy, and for places outside the region, routes use straight-line distances.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    environment:
      OSRM_PBF_URL: ${OSRM_PBF_URL:-https://download.openstreetmap.fr/extracts/asia/india/karnataka-latest.osm.pbf}
    command:
      - sh
      - -c
      - |
        set -e
        cd /data
        if [ "$$(cat region.url 2>/dev/null)" != "$$OSRM_PBF_URL" ]; then
          rm -f region.*
          wget -O region.osm.pbf "$$OSRM_PBF_URL"
          osrm-extract -p /opt/car.lua region.osm.pbf
          osrm-partition region.osrm
          osrm-customize region.osrm
          rm region.osm.pbf
          echo "$$OSRM_PBF_URL" > region.url
        fi
        exec osrm-routed --algorithm mld --max-table-size 1000 region.osrm
    ports:
      - "${OSRM_PORT:-5001}:5000"
    volumes:
      - osrm-data:/data
    networks: [fleet-net]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5000"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30m

networks:
  fleet-net:
    name: fleet-net

volumes:
  timescale-data:
  mosquitto-data:
  minio-data:
  redis-data:
  osrm-data:
