# Production with docker-compose.mqtt-tls.yml: 1883 stays inside the Docker network (backend, simulator),
# 8883 is published for real devices and requires TLS plus the username and password.
listener 1883
listener 8883
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem

allow_anonymous false
password_file /mosquitto/passwd

persistence true
persistence_location /mosquitto/data/
log_dest stdout
