name: CI

# Tests on every push and pull request; container images are built on main.
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B test

  ml-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  simulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python simulator.py --self-check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Development and production compose files are valid
        run: |
          cp .env.example .env    # the development compose file reads .env, which is not in git
          docker compose config --quiet
          docker compose --env-file .env.prod.example -f docker-compose.prod.yml -f docker-compose.mqtt-tls.yml config --quiet

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, ml-service, simulator, frontend, compose]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: backend, context: backend }
          - { name: ml-service, context: ml-service }
          - { name: frontend, context: frontend }
          - { name: simulator, context: simulator }
          - { name: backup, context: infra/backup }
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fleet-twin-${{ matrix.name }}:${{ github.sha }} ${{ matrix.context }}
