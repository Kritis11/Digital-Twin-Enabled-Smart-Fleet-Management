name: CI

# Tests on every push and pull request; container images are built on main.
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Formatting (mvn spotless:apply fixes it)
        run: mvn -B -q spotless:check
      # Unit tests, then the integration tests (Testcontainers starts TimescaleDB, Redis, Mosquitto and MinIO in Docker)
      - run: mvn -B verify
      - name: Coverage summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv
          rows = list(csv.DictReader(open('target/site/jacoco/jacoco.csv')))
          covered = sum(int(r['LINE_COVERED']) for r in rows); missed = sum(int(r['LINE_MISSED']) for r in rows)
          print(f"### Backend line coverage: {100 * covered / (covered + missed):.1f}% ({covered} of {covered + missed} lines)")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco

  ml-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint and formatting, all Python in the repository (ruff check --fix and black fix them)
        run: |
          pip install ruff==0.16.10 black==26.10.0
          ruff check ..
          black --check ..
      - run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=85

  simulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python simulator.py --self-check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx ng build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Development and production compose files are valid
        run: |
          cp .env.example .env    # the development compose file reads .env, which is not in git
          docker compose config --quiet
          docker compose --env-file .env.prod.example -f docker-compose.prod.yml -f docker-compose.mqtt-tls.yml config --quiet

  # Known vulnerabilities in what we depend on (docs/security.md). High and critical findings fail the build.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: e2e
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install pip-audit
          pip-audit -r ml-service/requirements.txt
          pip-audit -r simulator/requirements.txt

  # The production stack, built from this commit and filled with simulated history, driven by a real
  # browser through nginx: every role's main journeys (see e2e/tests).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Configure a throwaway production stack
        run: |
          secret=$(openssl rand -hex 24)
          sed -e 's/^DOMAIN=.*/DOMAIN=localhost/' -e "s/change-me[a-z0-9-]*/$secret/" \
              -e 's/^LOGIN_RATE_PER_MINUTE=.*/LOGIN_RATE_PER_MINUTE=600/' \
              -e 's#^OSRM_PBF_URL=.*#OSRM_PBF_URL=https://download.geofabrik.de/europe/monaco-latest.osm.pbf#' \
              .env.prod.example > .env.prod
          echo "E2E_ADMIN_PASSWORD=$secret" >> "$GITHUB_ENV"
      - name: Build and start
        run: docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build --wait
      - name: Seed 30 days of history and start the simulated vehicles
        run: |
          fleet() { docker compose --env-file .env.prod -f docker-compose.prod.yml --profile demo "$@"; }
          fleet run --rm -T simulator --fast-forward 30 --seed 42
          fleet up -d simulator
          token=$(curl -sk -X POST https://localhost/api/auth/login -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$E2E_ADMIN_PASSWORD\"}" | python3 -c 'import sys,json; print(json.load(sys.stdin)["accessToken"])')
          auth="Authorization: Bearer $token"
          curl -skf -X POST -H "$auth" https://localhost/api/admin/reanalyse
          # wait for the first telemetry of every vehicle (which raises the alerts), then run the recommendation rules
          for i in $(seq 1 30); do
            seen=$(curl -sk -H "$auth" https://localhost/api/vehicles | python3 -c 'import sys,json; print(sum(1 for t in json.load(sys.stdin) if t.get("lastSeen")))')
            [ "$seen" = 5 ] && break; sleep 2
          done
          curl -skf -X POST -H "$auth" https://localhost/api/recommendations/recompute
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Run the browser tests
        working-directory: e2e
        env:
          E2E_BASE_URL: https://localhost
          E2E_API_URL: https://localhost
          E2E_ADMIN_USERNAME: admin
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Container logs
        if: failure()
        run: docker compose --env-file .env.prod -f docker-compose.prod.yml --profile demo logs --tail 200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, ml-service, simulator, frontend, compose, e2e]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: backend, context: backend }
          - { name: ml-service, context: ml-service }
          - { name: frontend, context: frontend }
          - { name: simulator, context: simulator }
          - { name: backup, context: infra/backup }
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fleet-twin-${{ matrix.name }}:${{ github.sha }} ${{ matrix.context }}
      # Reported, not enforced: a base image can gain a finding with no fix available on any day.
      - name: Scan the image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
            --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed fleet-twin-${{ matrix.name }}:${{ github.sha }}
