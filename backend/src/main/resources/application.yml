spring:
  application:
    name: fleet-twin-backend
  config:
    # Credentials come from the repo-root .env (run from backend/) or real env vars.
    import: optional:file:../.env[.properties]
  autoconfigure:
    # No users yet: stops Boot generating and logging a default password.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always       # the reasons we give ("That username is taken") are meant for the user

fleet:
  mqtt:
    url: tcp://${MQTT_HOST:localhost}:${MQTT_PORT:1883}
    username: ${MQTT_USERNAME}
    password: ${MQTT_PASSWORD}
    client-id: fleet-twin-backend
    topic: fleet/+/telemetry
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  security:
    jwt-secret: ${JWT_SECRET}             # at least 32 characters; signs every token
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    admin-username: ${ADMIN_USERNAME:}    # the first admin, created only while there are no users
    admin-password: ${ADMIN_PASSWORD:}
    min-password-length: 10
  twin:
    offline-after: 30s            # no telemetry for this long -> OFFLINE
    moving-speed-kmh: 2           # above this -> MOVING, otherwise IDLE
    sweep-interval-ms: 5000       # how often the offline check runs
    maintenance-summary-size: 5   # records included in GET /api/vehicles/{id}/twin
  alerts:
    max-results: 500
  # Driving events, trips and the driver score. The formula is documented in docs/driver_score.md.
  driving:
    speed-limit-kmh: 80
    harsh-brake-ms2: 3.0          # deceleration at or above this is harsh braking
    rapid-accel-ms2: 2.5
    cornering-degrees: 25         # heading change between two readings that counts as a turn ...
    cornering-speed-kmh: 30       # ... and the speed at or above which taking it is "sharp"
    idle-after: 2m                # standing with the engine on for this long is excessive idling
    trip-gap: 5m                  # no telemetry, or standing still, for this long ends the trip
    min-score-km: 10              # trips shorter than this are scored as if they were this long
    weights:                      # penalty points per event, before the severity multiplier
      harsh-braking: 1.0
      rapid-acceleration: 0.6
      speeding: 0.4
      sharp-cornering: 0.6
      excessive-idling: 0.3
    severity-multipliers: { medium: 1.5, high: 2.0 }   # LOW is 1.0
    flush-interval-ms: 30000      # how often trips of vehicles that went quiet are closed
    max-results: 500              # cap on events / trips returned by one request
    twin-period: 7d               # the twin's driver score and fuel efficiency cover this long
    twin-refresh-ms: 60000        # ... and are refreshed this often
  fuel:
    tank-litres: 300              # fuel_level is a percentage of this
    idle-litres-per-hour: 3.2     # used to turn idling time into litres
    drop-percent: 3               # a fall of this much of the tank between two readings while parked is a FUEL_DROP
    low-efficiency-fraction: 0.25 # a trip this far below the vehicle's own baseline km/l is LOW_EFFICIENCY
    min-trip-km: 5                # shorter trips are too noisy to judge efficiency on
    baseline-trips: 20            # the baseline is the vehicle's previous this-many trips ...
    min-baseline-trips: 5         # ... and needs at least this many before anything is flagged
  ml:
    enabled: true
    url: ${ML_SERVICE_URL:http://localhost:8000}
    interval-ms: 10000            # how often every online vehicle is scored
    timeout: 2s                   # connect and read timeout per call
    window: 2m                    # telemetry sent to /anomaly (the model's longest feature window)
    anomaly-critical-score: 0.9   # ML alerts at or above this are CRITICAL, below it WARNING
    rul-interval-ms: 60000        # how often remaining useful life is refreshed for every vehicle
    rul-components: [brakes, battery, tyres, engine]
  # Maintenance recommendations. Each rule that fires adds a sentence to the reason; the highest
  # priority among them wins.
  recommendations:
    interval-ms: 900000           # recompute every 15 minutes
    initial-delay-ms: 60000
    anomaly-window: 7d            # how far back ML anomaly alerts count
    dismiss-snooze: 7d            # a dismissed recommendation is not raised again for this long, unless it got more urgent
    rules:
      urgent-rul-days: 3          # predicted failure within this many days -> URGENT
      high-rul-days: 10           # ... -> HIGH
      medium-rul-days: 21         # ... -> MEDIUM
      high-open-critical-alerts: 1   # this many unacknowledged CRITICAL alerts -> HIGH (any open WARNING -> MEDIUM)
      medium-anomalies: 3         # this many ML anomaly alerts within anomaly-window -> MEDIUM
      # also: current status CRITICAL -> URGENT, WARNING -> MEDIUM; service interval exceeded -> LOW
    due-days: { urgent: 1, high: 7, medium: 21, low: 45 }   # recommended-by date, capped by the RUL lower bound
    # action: recommended when the part is predicted to wear out (completing it resets the wear reading
    # `sensor` to `new-value`). inspect-action: recommended when the only evidence is alerts, anomalies,
    # status or an overdue service; completing it records the work but resets nothing.
    components:
      brakes:  { action: Replace brake pads, inspect-action: Inspect brakes,       sensor: brakePadWear,  new-value: 0,   service-interval-days: 60, service-interval-km: 15000 }
      battery: { action: Replace battery,    inspect-action: Test battery,         sensor: batteryHealth, new-value: 100, service-interval-days: 90 }
      tyres:   { action: Replace tyres,      inspect-action: Inspect tyres,        sensor: tyreTread,     new-value: 8,   service-interval-days: 90, service-interval-km: 25000 }
      engine:  { action: Service engine,     inspect-action: Inspect engine,       sensor: engineHealth,  new-value: 100, service-interval-days: 60, service-interval-km: 20000 }
      fuel:    { inspect-action: Inspect fuel system }
  # Route optimisation (POST /api/routes/optimise). The solver runs in the ML service.
  routes:
    min-rul-days: 3               # a part predicted to fail sooner than this keeps the vehicle off routes
    fuel-weight: 0.5              # how strongly worse fuel efficiency makes a vehicle less preferred
    driver-score-weight: 0.5      # ... and a lower driver score
    default-km-per-litre: 2.2     # for fuel estimates when a vehicle has no recent trips
    balance: 10                   # weight on the longest route's duration; 0 = shortest total distance, even if one vehicle does it all
    solver-seconds: 3             # search time per request
    timeout: 30s                  # for the call to the ML service
    default-service-minutes: 10   # time spent at a stop unless the request says otherwise
    max-stops: 100
  reports:
    bucket: ${REPORTS_BUCKET:reports}
    max-results: 200              # past reports listed
    max-period-days: 366
    email:                        # weekly reports by email; needs SMTP_HOST etc. below
      enabled: ${REPORTS_EMAIL_ENABLED:false}
      cron: ${REPORTS_EMAIL_CRON:0 0 6 * * MON}   # Mondays 06:00, covering the previous 7 days
      from: ${REPORTS_EMAIL_FROM:fleet-twin@localhost}
      to: ${REPORTS_EMAIL_TO:}    # comma-separated
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:${MINIO_API_PORT:9000}}
    access-key: ${MINIO_ROOT_USER}
    secret-key: ${MINIO_ROOT_PASSWORD}
  utilisation:
    working-hours-per-day: 10     # 100% utilisation = on trips for this long every day
    under-used-below: 0.3
    over-used-above: 0.85
  telemetry:
    default-buckets: 300          # points returned when ?interval= is omitted
    max-buckets: 2000
  # Component status rules. A component's status is the worst of its rules.
  # Limits: warning-above, critical-above, warning-below, critical-below (all optional).
  # Metrics: speed, engineTemp, rpm, batteryVoltage, fuelLevel, vibration, brakePadWear,
  #          tyrePressureFl, tyrePressureFr, tyrePressureRl, tyrePressureRr,
  #          batteryHealth (%), tyreTread (mm), engineHealth (0-100).
  rules:
    - { component: engine,  metric: engineTemp,     warning-above: 105,  critical-above: 115 }
    - { component: engine,  metric: vibration,      warning-above: 1.5,  critical-above: 2.5 }
    - { component: engine,  metric: engineHealth,   warning-below: 55,   critical-below: 45 }
    - { component: battery, metric: batteryVoltage, warning-below: 12.4, critical-below: 11.8 }
    - { component: battery, metric: batteryHealth,  warning-below: 60,   critical-below: 50 }
    - { component: brakes,  metric: brakePadWear,   warning-above: 70,   critical-above: 85 }
    - { component: tyre_fl, metric: tyrePressureFl, warning-below: 28,   critical-below: 24 }
    - { component: tyre_fr, metric: tyrePressureFr, warning-below: 28,   critical-below: 24 }
    - { component: tyre_rl, metric: tyrePressureRl, warning-below: 28,   critical-below: 24 }
    - { component: tyre_rr, metric: tyrePressureRr, warning-below: 28,   critical-below: 24 }
    - { component: tyre_fl, metric: tyreTread,      warning-below: 3,    critical-below: 2 }
    - { component: tyre_fr, metric: tyreTread,      warning-below: 3,    critical-below: 2 }
    - { component: tyre_rl, metric: tyreTread,      warning-below: 3,    critical-below: 2 }
    - { component: tyre_rr, metric: tyreTread,      warning-below: 3,    critical-below: 2 }
    - { component: fuel,    metric: fuelLevel,      warning-below: 15,   critical-below: 7 }

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  server:
    # Production gives actuator its own, unpublished port (see SecurityConfig). Same port in development.
    port: ${MANAGEMENT_PORT:${server.port}}
  health:
    mail:
      enabled: false              # email is optional; an unreachable SMTP server must not mark the backend unhealthy
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
